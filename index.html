<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚩 Red Flags da Liz 🚩</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%9A%A9</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="flags-bg" id="flagsBg"></div>

  <main class="container">
    <header class="header">
      <h1>🚩 RED FLAGS DA LIZ 🚩</h1>
      <p class="subtitle">análise oficial e 100% científica (não confie)</p>
    </header>

    <section class="meter-section">
      <p class="meter-label">Nível de Red Flag: <span id="meterValue">0</span>%</p>
      <div class="meter-bar">
        <div class="meter-fill" id="meterFill"></div>
      </div>
      <p class="meter-status" id="meterStatus">carregando dados... 📡</p>
    </section>

    <div class="actions">
      <button id="addFlagBtn">🚩 Revelar mais uma red flag</button>
      <button id="resetBtn" class="secondary">🔄 Resetar</button>
    </div>

    <section class="cards" id="cardsContainer"></section>

    <footer class="footer">
      feito com 💀 e muito carinho (?) para a Liz
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
